name: Repo Check

on:
   push:
      branches: [main]
   pull_request:
   workflow_dispatch:

jobs:
   check:
      # Every configured linter over the whole repo: prettier, eslint + tsc via
      # turbo, stylelint, markdownlint, textlint, knip, jscpd. Deliberately
      # unfiltered by path — knip, jscpd and prettier are whole-tree verdicts,
      # and a change anywhere can break one.
      runs-on: ubuntu-latest

      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - name: Pin npm 12
           run: npm install -g npm@12

         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project

         - name: Install dependencies
           run: npm ci

         - name: Check (every configured linter, repo-wide)
           run: npm run check

         # .npmrc is excluded: the Enforce step above writes strict-allow-scripts
         # into it, which is the runner-only half of the allowlist config.
         - name: Fail if check had to fix anything
           run: |
              if [ -n "$(git status --porcelain -- . ":(exclude).npmrc")" ]; then
                 git status --porcelain -- . ":(exclude).npmrc"
                 git diff -- . ":(exclude).npmrc"
                 exit 1
              fi
