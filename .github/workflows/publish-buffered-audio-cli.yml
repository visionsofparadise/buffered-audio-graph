name: Publish Buffered Audio CLI

on:
   push:
      branches: [main]
      paths:
         - "packages/buffered-audio-cli/package.json"
   workflow_dispatch:

jobs:
   publish:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         id-token: write
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"

         - name: Pin npm 12
           run: npm install -g npm@12

         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project

         - name: Check if version is already published
           id: check
           run: |
              PACKAGE_VERSION=$(node -p "require('./packages/buffered-audio-cli/package.json').version")
              PUBLISHED=$(npm view "@buffered-audio/cli@$PACKAGE_VERSION" version 2>/dev/null || echo "")
              if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
              fi

         - name: Install dependencies
           if: steps.check.outputs.skip == 'false'
           run: npm ci

         - name: Type check and lint (topo-ordered)
           if: steps.check.outputs.skip == 'false'
           run: npx turbo check --filter=@buffered-audio/cli

         - name: Run unit tests
           if: steps.check.outputs.skip == 'false'
           run: npx turbo unit --filter=@buffered-audio/cli

         - name: Build (topo-ordered)
           if: steps.check.outputs.skip == 'false'
           run: npx turbo build --filter=@buffered-audio/cli --filter=@buffered-audio/nodes

         - name: Run integration tests
           if: steps.check.outputs.skip == 'false'
           run: npx turbo run integration --filter=@buffered-audio/cli

         - name: Wait for pinned @buffered-audio dependencies on npm
           if: steps.check.outputs.skip == 'false'
           run: |
              PINS=$(node -p "const { dependencies = {}, peerDependencies = {}, optionalDependencies = {} } = require('./packages/buffered-audio-cli/package.json'); Object.entries({ ...dependencies, ...peerDependencies, ...optionalDependencies }).filter(([name]) => name.startsWith('@buffered-audio/')).map(([name, version]) => name + '@' + version).join(' ')")
              DEADLINE=$(( $(date +%s) + 1800 ))
              for PIN in $PINS; do
                until [ -n "$(npm view "$PIN" version --prefer-online 2>/dev/null)" ]; do
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    echo "::error::$PIN is still not on npm after 30 minutes"
                    exit 1
                  fi
                  echo "Waiting for $PIN on npm"
                  sleep 30
                done
                echo "$PIN is on npm"
              done

         - name: Publish to npm
           if: steps.check.outputs.skip == 'false'
           run: npm publish --workspace=packages/buffered-audio-cli --access public
